# F-Droid build recipe for ApexFOSS — prepared 2026-10-04, nothing submitted.
# Copy this file into a fork of fdroiddata (GitLab) as metadata/com.apexfoss.app.yml.
# Verify with `fdroid lint` + `fdroid rewritemeta` + a trial build before the MR.
#
# Key decisions (do not "simplify" without re-reading fdroidserver):
# - No `subdir: android`: prepare_source() raises "Missing subdir" for directories
#   absent from the checkout, and android/ is CNG (gitignored, generated by
#   expo prebuild). A manual build (no `gradle:` field) runs the whole toolchain
#   in `build:` instead — the same pattern as fr.shiningcat.simplehiit on fdroiddata.
#   Scanner + source tarball run BEFORE `build:`, so node_modules/ and the
#   generated android/ never reach the binary scan or the tarball.
# - `-PapexFdroid=true` is passed inline in the gradle invocation (manual builds
#   have no gradle phase for the `gradleprops` field).
# - `commit:` is the full hash (documented preference over tag names); auto-updates
#   still resolve future releases via tags (AutoUpdateMode: Version + Tags check).
# - UpdateCheckData reads app.json: the repo commits no build.gradle/AndroidManifest
#   (CNG), so F-Droid's default tag extraction cannot work.
# - Node 22 (NodeSource apt repo) + openjdk-17: the builder's stock Debian toolchain
#   is too old for Expo SDK 55 / RN 0.83.

Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: v0idbrn
SourceCode: https://github.com/v0idbrn/ApexFOSS
IssueTracker: https://github.com/v0idbrn/ApexFOSS/issues
Changelog: https://github.com/v0idbrn/ApexFOSS/blob/main/CHANGELOG.md
Donate:
  - https://github.com/sponsors/v0idbrn
  - https://paypal.me/amelie615
  - https://link.mercadopago.com.ar/openv0id

RepoType: git
Repo: https://github.com/v0idbrn/ApexFOSS.git

AutoUpdateMode: Version
UpdateCheckMode: Tags ^v\d+\.\d+\.\d+$
UpdateCheckData: 'app.json|"versionCode":\s*(\d+)|app.json|"version":\s*"([^"]+)"'
CurrentVersion: 1.1.1
CurrentVersionCode: 4

Builds:
  - versionName: 1.1.1
    versionCode: 4
    commit: 7a6b06791c26821b50e9851a12700773653fd397
    ndk: 27.1.12297006
    sudo:
      - apt-get update
      - apt-get install -y ca-certificates curl gnupg openjdk-17-jdk-headless
      - install -d -m 0755 /etc/apt/keyrings
      - curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      - echo "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_22.x nodistro main" > /etc/apt/sources.list.d/nodesource.list
      - apt-get update
      - apt-get install -y --allow-downgrades nodejs
    build:
      - npm ci
      - APEX_SKIP_SIGNING=1 npx expo prebuild -p android --clean
      - cd android && sh gradlew assembleRelease -PapexFdroid=true
    output: android/app/build/outputs/apk/release/app-release.apk
