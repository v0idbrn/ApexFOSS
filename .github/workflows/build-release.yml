name: Build Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 36
          ndk-version: 27.1.12297006
          build-tools: 36.0.0

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: gradle-${{ runner.os }}-

      - name: Install dependencies
        run: npm ci
        working-directory: .

      - name: Prebuild Android
        run: APEX_SKIP_SIGNING=1 npx expo prebuild -p android --clean
        working-directory: .

      - name: Build Release APK
        run: ./gradlew assembleRelease -PapexFdroid=false
        working-directory: ./android

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: apexfoss-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk

      - name: Calculate SHA-256
        run: |
          sha256sum android/app/build/outputs/apk/release/app-release.apk > checksum.sha256
          cat checksum.sha256

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: ApexFOSS ${{ github.ref_name }}
          body_path: CHANGELOG.md
          files: |
            android/app/build/outputs/apk/release/app-release.apk
            checksum.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}