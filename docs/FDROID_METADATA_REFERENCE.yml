# F-Droid submission reference (NON-AUTHORITATIVE DRAFT)

# This file is a local planning reference for a FUTURE fdroiddata merge
# request. It is NOT submitted anywhere and does NOT replace the official
# metadata. Field names follow fdroiddata conventions loosely; confirm
# against current fdroiddata documentation at submission time.

packageId: com.apexfoss.app
sourceRepo: https://github.com/v0idbrn/ApexFOSS.git
license: GPL-3.0-or-later
versionName: 1.1.0
versionCode: 3
# Tag strategy: v1.1.0 (created for the GitHub release; F-Droid UpdateCheckMode Tags tracks it).

build:
  system: gradle + nodejs (Expo CNG prebuild required)
  gradleVersion: 9.0.0
  jdk: 17
  androidSdk:
    compileSdk: 36
    targetSdk: 36
    minSdk: 24
    buildTools: 36.0.0
    ndk: 27.1.12297006
  node: v24.15.0 (pin a working version in the recipe)
  # android/ is GENERATED (gitignored): recipe must run
  #   npm install && APEX_SKIP_SIGNING=1 npx expo prebuild -p android --clean
  # BEFORE gradle. APEX_SKIP_SIGNING=1 is the validated sign-less path (D-055):
  # the signing plugin warns and skips, Gradle falls back to debug signing
  # (F-Droid re-signs). Default prebuild without the variable still fails fast
  # when the maintainer config is absent — by design, never weaken it.
  outputApk: app/build/outputs/apk/release/app-release.apk
  # Preferred submission artifact for Play is the AAB
  # (app/build/outputs/bundle/release/app-release.aab); F-Droid builds APK.

antiFeatures: []  # assessment: none applicable; F-Droid reviewers decide.

flavours: false   # no store-specific runtime behavior exists by design.

openItems:
  - Trial recipe proving CNG + Metro/Hermes build in F-Droid infra.
  - Reviewer judgment on firebase-messaging (dead code, no INTERNET).
  - Tag v1.1.0 exists (GitHub release); keep tags per release for UpdateCheckMode.
  - Re-verify Gradle-artifact licenses at submission time.

links:
  readinessDoc: docs/DISTRIBUTION_FDROID.md
  matrixDoc: docs/DISTRIBUTION_MATRIX.md
  fastlaneMetadata: fastlane/metadata/android/
