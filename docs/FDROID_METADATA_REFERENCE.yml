# F-Droid submission reference (NON-AUTHORITATIVE MIRROR)

# This file mirrors the recipe submitted as fdroiddata merge request !51203
# (branch com.apexfoss.app). The authoritative copy lives in the fork; this
# mirror exists so the repository documents what was submitted. Field names
# follow fdroiddata conventions loosely.

packageId: com.apexfoss.app
sourceRepo: https://github.com/v0idbrn/ApexFOSS.git
license: GPL-3.0-or-later
versionName: 1.1.4
versionCode: 7
# Tag strategy: v1.1.4 (created for the GitHub release; F-Droid UpdateCheckMode Tags tracks it).

build:
  system: gradle + nodejs (Expo CNG prebuild required)
  gradleVersion: 9.0.0
  jdk: 21 from Trixie (default JVM) + temurin-17-jdk from the Adoptium repo (RN hardcodes jvmToolchain(17); Trixie has no openjdk-17 package)
  androidSdk:
    compileSdk: 36
    targetSdk: 36
    minSdk: 24
    buildTools: 36.0.0
    ndk: 27.1.12297006
  node: v24.15.0 (pin a working version in the recipe)
  # android/ is GENERATED (gitignored): recipe must run
  #   npm install && APEX_SKIP_SIGNING=1 npx expo prebuild -p android --clean
  # BEFORE gradle. APEX_SKIP_SIGNING=1 is the validated sign-less path (D-055):
  # the signing plugin warns and skips, Gradle falls back to debug signing
  # (F-Droid re-signs). Default prebuild without the variable still fails fast
  # when the maintainer config is absent — by design, never weaken it.
  outputApk: app/build/outputs/apk/release/app-release.apk
  # Preferred submission artifact for Play is the AAB
  # (app/build/outputs/bundle/release/app-release.aab); F-Droid builds APK.

antiFeatures: []  # assessment: none applicable; F-Droid reviewers decide.

flavours: invocation-scoped, not a Gradle product flavor
  # `-PapexFdroid=true` excludes expo-notifications (Firebase/FCM) and links
  # modules/apex-notifications (AlarmManager + NotificationManager only).
  # Default invocation keeps the upstream notification stack.

openItems:
  - Reviewer sign-off on !51203 (open since 2026-10-05; updated to 1.1.4).
  - Device validation of local notifications on physical hardware.
  - Re-verify Gradle-artifact licenses at each release.

links:
  readinessDoc: docs/DISTRIBUTION_FDROID.md
  matrixDoc: docs/DISTRIBUTION_MATRIX.md
  fastlaneMetadata: fastlane/metadata/android/
  fdroidRecipe: metadata/com.apexfoss.app.yml
